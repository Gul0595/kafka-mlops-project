name: Kafka ML Retraining Pipeline

on:
  #schedule:
    #- cron: "*/15 * * * *"   # every 15 minutes
  workflow_dispatch:

jobs:
  retrain:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn mlflow mysql-connector-python

      - name: Run model training
        run: |
          cd training
          python train_model.py
